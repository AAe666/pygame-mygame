<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工作台_v14</title>
<style>
  :root{
    --bg:#fff7ef; --card:#ffffff; --ink:#2b2b3a; --sub:#9a9aac;
    --main:#ff8a3d; --main2:#ffd23f; --ok:#34c759; --red:#ff3b30;
    --r:22px; --tap:50px; --safe:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:18px; line-height:1.5;
    padding-bottom:calc(86px + var(--safe));
  }
  svg{display:block;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;font-size:16px;}
  .icon{width:22px;height:22px;}

  .topbar{position:relative;background:linear-gradient(135deg,var(--main),var(--main2));
    padding:12px 14px 12px;color:#fff;box-shadow:0 4px 16px rgba(255,138,61,.30);}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;}
  .brand .icon{width:28px;height:28px;}
  .ver{font-size:11px;font-weight:800;background:rgba(255,255,255,.28);padding:2px 8px;border-radius:8px;margin-left:2px;letter-spacing:.5px;}
  .backup{display:flex;gap:8px;}
  .backup button{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:14px;
    height:44px;min-width:44px;padding:0 10px;font-size:14px;font-weight:700;
    display:flex;align-items:center;gap:5px;}
  .backup button .icon{width:18px;height:18px;}
  .sync{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:8px;opacity:.95;}
  .sync .dot{width:9px;height:9px;border-radius:50%;background:#fff;}
  .modetabs{display:flex;gap:8px;margin-top:11px;}
  .modetabs button{flex:1;height:var(--tap);border:none;border-radius:16px;font-size:17px;font-weight:800;
    background:rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s;}
  .modetabs button .icon{width:22px;height:22px;}
  .modetabs button.on{background:#fff;color:var(--main);box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .kids{display:flex;gap:8px;margin-top:11px;}
  .kids button{flex:1;height:var(--tap);border:none;border-radius:16px;font-size:16px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.25);color:#fff;transition:.15s;}
  .kids button.on{background:#fff;color:var(--main);box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .kids .ava{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:none;}
  .kids button.on .ava{background:var(--main);}

  .wrap{padding:14px;max-width:760px;margin:0 auto;}
  .card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px;}
  .card h3 .icon{width:22px;height:22px;color:var(--main);}

  .today{margin:12px 14px 0;background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);}
  .today .hi{display:flex;align-items:center;gap:12px;}
  .ava2{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:none;}
  .today .nm{font-weight:900;font-size:20px;}
  .today .st{font-size:14px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .starnum{display:inline-flex;align-items:center;gap:3px;color:#e0a200;font-weight:800;font-size:14px;}
  .starnum .icon{width:15px;height:15px;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
    font-size:13px;font-weight:800;color:#fff;}
  .bigbtn{width:100%;height:var(--tap);border:none;border-radius:16px;background:var(--main);color:#fff;
    font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;}
  .bigbtn .icon{width:22px;height:22px;}
  .bigbtn.ghost{background:#fff;border:2px solid var(--main);color:var(--main);}
  .bigbtn.warn{background:#ff9f1c;}
  .bigbtn.danger{background:var(--red);}

  .hero{background:linear-gradient(135deg,#fff0d6,#ffe2ec);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:14px;}
  .hero .num{font-size:42px;font-weight:900;color:#e8890a;display:flex;align-items:center;justify-content:center;gap:8px;}
  .hero .num .icon{width:34px;height:34px;}
  .hero .lbl{font-size:14px;color:#a07b3a;font-weight:700;margin-top:2px;}

  .piewrap{display:flex;justify-content:center;margin:8px 0;}
  .pie{width:160px;height:160px;}
  .pieempty{text-align:center;color:var(--sub);padding:34px 10px;background:#fafaff;border-radius:16px;font-size:15px;font-weight:700;}
  .pielegend{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
  .lg{display:flex;align-items:center;gap:9px;font-size:14px;background:#fffaf3;border:1px solid #f0e6da;border-radius:12px;padding:7px 11px;}
  .lg .ld{width:14px;height:14px;border-radius:4px;flex:none;}
  .lg .lv{margin-left:auto;font-weight:900;color:var(--ink);}

  .logscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.log{width:100%;border-collapse:collapse;table-layout:fixed;}
  table.log th,table.log td{padding:8px 5px;text-align:left;border-bottom:1px dashed #f0e6da;font-size:13px;white-space:nowrap;vertical-align:middle;}
  table.log th{color:var(--sub);font-weight:800;font-size:12px;}
  /* 固定列收窄靠左，备注列吃满剩余宽度并自动换行：时间右侧不留空隙，长备注完整可见 */
  table.log td:last-child,table.log th:last-child{white-space:normal;word-break:break-all;vertical-align:top;}
  table.log td:nth-child(4){overflow:hidden;text-overflow:ellipsis;}
  .tbadge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;}
  .tbadge.task{background:var(--ok);}
  .tbadge.reward{background:var(--main);}
  .splus{color:var(--ok);font-weight:900;}
  .sminus{color:var(--red);font-weight:900;}
  .empty{text-align:center;color:var(--sub);padding:26px 10px;font-size:15px;}

  .catrow{display:flex;align-items:center;gap:10px;background:#fffaf3;border:1px solid #f0e6da;border-radius:16px;padding:11px 12px;margin-bottom:9px;}
  .catrow .ct{font-weight:800;font-size:16px;flex:1;}
  .catrow .mini{width:42px;height:42px;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#ffe9e7;color:var(--red);flex:none;}
  .catrow .mini .icon{width:19px;height:19px;}
  .addrow{display:flex;gap:8px;margin-top:6px;}
  .addrow input{flex:1;height:var(--tap);border:2px solid #ececf2;border-radius:14px;padding:0 13px;font-size:16px;background:#fafaff;}
  .addrow input:focus{outline:none;border-color:var(--main);}
  .addrow button{width:var(--tap);height:var(--tap);border:none;border-radius:14px;background:var(--ok);color:#fff;font-weight:900;font-size:22px;flex:none;}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid #f0e6da;
    display:flex;padding:8px 6px calc(8px + var(--safe));box-shadow:0 -4px 16px rgba(0,0,0,.06);}
  .nav button{flex:1;border:none;background:none;color:var(--sub);font-size:12px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;}
  .nav button .icon{width:26px;height:26px;}
  .nav button.on{color:var(--main);}

  .mask{position:fixed;inset:0;background:rgba(30,20,10,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:18px;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:24px;width:100%;max-width:380px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);
    max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .modal h4{margin:0 0 14px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .modal h4 .icon{width:22px;height:22px;color:var(--main);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:5px;}
  .field input,.field select{width:100%;height:var(--tap);border:2px solid #ececf2;border-radius:14px;
    padding:0 13px;font-size:16px;background:#fafaff;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--main);}
  .modal .row2{display:flex;gap:10px;}
  .modal .row2 button{flex:1;height:var(--tap);border-radius:14px;font-weight:800;font-size:16px;border:none;}
  .btnok{background:var(--main);color:#fff;}
  .btnno{background:#f1f1f6;color:#555;}
  .pwdinput{font-size:30px;letter-spacing:14px;text-align:center;font-weight:900;}

  .toast{position:fixed;left:50%;top:74px;transform:translateX(-50%);background:rgba(40,30,20,.92);color:#fff;
    padding:11px 18px;border-radius:14px;font-weight:700;font-size:15px;z-index:80;opacity:0;transition:.25s;pointer-events:none;
    white-space:normal;word-break:break-all;max-width:86vw;text-align:center;line-height:1.4;}
  .toast.show{opacity:1;}
  /* —— 任务/兑换：搜索 + 分类折叠分组 —— */
  .toolbar{display:flex;gap:8px;margin:0 0 12px;}
  .search{flex:1;min-width:0;height:42px;border:2px solid #ececf2;border-radius:14px;padding:0 12px;font-size:16px;background:#fafaff;}
  .search:focus{outline:none;border-color:var(--main);}
  .group{margin-bottom:6px;}
  .cathead{display:flex;align-items:center;gap:8px;width:100%;padding:10px 2px 8px;margin-top:10px;border:none;background:none;
    border-top:2px solid #f0e6da;font-size:15px;font-weight:800;text-align:left;}
  .cathead:first-child{border-top:none;margin-top:0;}
  .car{width:18px;height:18px;color:var(--sub);display:flex;align-items:center;transition:transform .15s;}
  .car.off{transform:rotate(-90deg);}
  .car .icon{width:18px;height:18px;}
  .chn{flex:1;line-height:1.2;}
  .cnt{font-size:12px;color:var(--sub);background:#f7f2ea;border-radius:8px;padding:2px 8px;white-space:nowrap;}
  /* —— 预设条目：名称在上、分类在下（彩色），星数在右 —— */
  .presetitem{position:relative;display:flex;flex-direction:column;gap:5px;width:100%;padding:12px 58px 12px 14px;margin:0 0 10px;
    background:#fff;border:2px solid #f0e6da;border-radius:16px;text-align:left;}
  .presetitem:active{transform:scale(.98);}
  .pin{font-size:17px;font-weight:800;line-height:1.4;word-break:break-all;}
  .pcat{font-size:13px;display:flex;align-items:center;gap:6px;font-weight:600;}
  .pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .pis{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;font-weight:900;}
  /* —— 日志：左名称（可换行）+ 右星数，下方小字完整日期·分类 —— */
  .loglist{display:flex;flex-direction:column;}
  .logitem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:0 0 10px;background:#fff;
    border:2px solid #f0e6da;border-radius:16px;}
  .logmain{flex:1;min-width:0;}
  .logname{font-size:17px;font-weight:800;line-height:1.45;word-break:break-all;}
  .logmeta{font-size:13px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:6px;}
  .logside{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0;}
  .logplus{color:var(--ok);font-size:18px;font-weight:900;white-space:nowrap;}
  .logminus{color:var(--main);font-size:18px;font-weight:900;white-space:nowrap;}
  .logdel{width:38px;height:38px;min-width:38px;border:none;background:#f1f1f6;border-radius:11px;color:#888;
    display:flex;align-items:center;justify-content:center;padding:0;}
  .logdel .icon{width:17px;height:17px;}
  /* —— 家长预设编辑列表 —— */
  .catrow .cs{font-size:13px;color:var(--sub);margin-left:auto;white-space:nowrap;}
  .addrow select{height:var(--tap);border:2px solid #ececf2;border-radius:14px;font-size:16px;background:#fafaff;padding:0 6px;max-width:130px;}
  .addrow input[type=number]{width:70px;height:var(--tap);border:2px solid #ececf2;border-radius:14px;font-size:16px;background:#fafaff;padding:0 8px;text-align:center;}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden;}
  .conf{position:absolute;top:40%;left:50%;width:18px;height:18px;animation:fly .9s ease-out forwards;}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.3);opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(220deg);opacity:0;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="toprow">
    <div class="brand"><span id="brandIcon"></span>工作台<span class="ver">v14</span></div>
    <div class="backup">
      <button id="btnExport" title="导出备份"><span class="icon" data-i="download"></span>导出</button>
      <button id="btnImport" title="导入恢复"><span class="icon" data-i="upload"></span>导入</button>
    </div>
  </div>
  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">连接中…</span></div>
  <div class="modetabs">
    <button id="tabKid" class="on"><span class="icon" data-i="kid"></span>儿童模式</button>
    <button id="tabPar"><span class="icon" data-i="lock"></span>家长模式</button>
  </div>
  <div class="kids" id="kids"></div>
</div>

<div id="todayBox"></div>
<div id="app" class="wrap"></div>

<div class="nav" id="nav"></div>

<!-- 密码弹窗（任务/兑换/进家长模式） -->
<div class="mask" id="maskPwd"><div class="modal">
  <h4><span class="icon" data-i="lock"></span><span id="pwdTitle">请输入密码</span></h4>
  <div class="field"><input id="pwdInput" class="pwdinput" type="password" inputmode="numeric" pattern="\d*" autocomplete="off" maxlength="4" placeholder="请输入密码"></div>
  <div class="row2">
    <button class="btnno" id="pwdCancel">取消</button>
    <button class="btnok" id="pwdOk">确定</button>
  </div>
</div></div>

<!-- 设置/修改密码 -->
<div class="mask" id="maskSet"><div class="modal">
  <h4><span class="icon" data-i="lock"></span><span id="setTitle">设置</span></h4>
  <div class="field"><label>输入 4 位数字密码</label><input id="setInput" class="pwdinput" type="password" inputmode="numeric" pattern="\d*" autocomplete="off" maxlength="4" placeholder="请输入新密码"></div>
  <div class="row2">
    <button class="btnno" id="setCancel">取消</button>
    <button class="btnok" id="setOk">保存</button>
  </div>
</div></div>

<!-- 二次确认 -->
<div class="mask" id="maskConfirm"><div class="modal">
  <h4><span class="icon" data-i="trash"></span><span id="confirmTitle">确认</span></h4>
  <p id="confirmTxt" style="font-size:15px;color:var(--ink);margin:0 0 16px;line-height:1.5"></p>
  <div class="row2">
    <button class="btnno" id="confirmCancel">取消</button>
    <button class="btnok" id="confirmOk">确定</button>
  </div>
</div></div>

<!-- 家长：编辑预设（改星/改分类） -->
<div class="mask" id="maskPre"><div class="modal">
  <h4><span class="icon" data-i="edit"></span><span id="preTitle">编辑预设</span></h4>
  <div class="field"><label>名称（重名不允许）</label><input id="preName" type="text" maxlength="12"></div>
  <div class="field"><label>星星数量</label><input id="preStars" type="number" inputmode="numeric" min="1" max="9999" step="1" value="1"></div>
  <div class="field"><label>分类</label><select id="preCat"></select></div>
  <div class="row2">
    <button class="btnno" id="preCancel">取消</button>
    <button class="btnok" id="preOk">保存</button>
  </div>
</div></div>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>

<script>
"use strict";
/* ===================== 云端数据库（Supabase，新行ID命名空间 bby_*） ===================== */
const SB_URL="https://ebvywccxopurvuqtpmhq.supabase.co/rest/v1";
const SB_KEY="sb_publishable_V99ph9Xk7d3gPezv3kQBFA_GkRDEv2l";
const TABLE="bb_rows";
const H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};

async function apiGetAll(){
  let out=[],offset=0,batch;
  do{
    const r=await fetch(`${SB_URL}/${TABLE}?select=id,data&order=id.asc&limit=1000&offset=${offset}`,{headers:H});
    if(!r.ok) throw new Error("GET "+r.status);
    batch=await r.json(); out=out.concat(batch); offset+=1000;
  }while(batch.length===1000);
  return out;
}
async function apiUpsert(rows){
  const r=await fetch(`${SB_URL}/${TABLE}`,{method:"POST",
    headers:Object.assign({},H,{"Prefer":"resolution=merge-duplicates, return=minimal"}),
    body:JSON.stringify(rows)});
  if(!r.ok) throw new Error("UPSERT "+r.status);
}
async function apiDelete(id){
  const r=await fetch(`${SB_URL}/${TABLE}?id=eq.${encodeURIComponent(id)}`,{method:"DELETE",headers:H});
  if(!r.ok) throw new Error("DELETE "+r.status);
}
async function apiGetRow(id){
  const r=await fetch(`${SB_URL}/${TABLE}?id=eq.${encodeURIComponent(id)}&select=id,data`,{headers:H});
  if(!r.ok) throw new Error("GET "+r.status);
  const a=await r.json(); return (a&&a[0])?a[0].data:null;
}

/* ===================== 本地状态 + 缓存 ===================== */
const TASK_DEF=["习惯","学习","家务","运动","阅读","识字","英语","数学","艺术","自理","礼貌","科普","古诗","科学"];
const REWARD_DEF=["零食","玩具","图书","外出","看动画","游戏时间","零花钱","其他"];
/* 12 色高区分度配色（红/绿/蓝/橙/紫/青/品红/黄绿/粉/青绿/淡紫/棕），避免相邻分类肉眼难分 */
/* D3 标准分类色（category10）：蓝/橙/绿/红/紫/棕/粉/灰/黄绿/青，业内公认的高区分度分类配色 */
const PAL=["#1f77b4","#ff7f0e","#2ca02c","#d62728","#9467bd","#8c564b","#e377c2","#7f7f7f","#bcbd22","#17becf"];
/* 默认预设任务 / 预设兑换（还原旧版启蒙台的预设体系，家长可增删改星改分类） */
const PRESET_TASK_DEF=[
  {name:"背《咏鹅》",stars:1,category:"古诗"},{name:"数到 100",stars:1,category:"数学"},
  {name:"画一幅画",stars:1,category:"艺术"},{name:"船为什么能浮起来",stars:1,category:"科学"},
  {name:"自己收拾玩具",stars:1,category:"习惯"},{name:"坐在餐桌上独自吃早餐",stars:2,category:"习惯"},
  {name:"坐在餐桌上独自吃中餐",stars:2,category:"习惯"},{name:"坐在餐桌上独自吃晚餐",stars:2,category:"习惯"},
  {name:"背诵26个英文单词",stars:3,category:"英语"}
];
const PRESET_REWARD_DEF=[
  {name:"适当看电视",stars:1,category:"看动画"},{name:"小零食",stars:3,category:"零食"},
  {name:"去游乐场玩",stars:5,category:"外出"},{name:"大零食",stars:6,category:"零食"},
  {name:"小玩具",stars:10,category:"玩具"},{name:"大玩具",stars:30,category:"玩具"}
];
/* 预设排序：先按所需星星数从小到大，再按拼音 */
const sortPresets=a=>[...a].sort((x,y)=>x.stars-y.stars||String(x.name).localeCompare(String(y.name),"zh-Hans-CN"));
/* 排序（任务/兑换）：最优先分类（分类按拼音），再按星数，再按拼音 */
function sortFlat(arr){
  return [...arr].sort((a,b)=>{
    const c=String(a.category||"其他").localeCompare(String(b.category||"其他"),"zh-Hans-CN");
    if(c) return c;
    if(a.stars!==b.stars) return a.stars-b.stars;
    return String(a.name).localeCompare(String(b.name),"zh-Hans-CN");
  });
}
function groupByCat(arr){
  const map={}; arr.forEach(p=>{const k=String(p.category||"其他");(map[k]=map[k]||[]).push(p);});
  return Object.keys(map).sort((a,b)=>a.localeCompare(b,"zh-Hans-CN")).map(k=>({cat:k,items:sortFlat(map[k])}));

function beijingNow(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  const bj=new Date(d.getTime()+8*3600*1000); // 绝对时间 +8 小时，再按 UTC 字段读取，即得北京时间（不受设备时区影响）
  return bj.getUTCFullYear()+"-"+p(bj.getUTCMonth()+1)+"-"+p(bj.getUTCDate())+" "+p(bj.getUTCHours())+":"+p(bj.getUTCMinutes())+":"+p(bj.getUTCSeconds());
}

function spent(c){return (state.logs[c.id]||[]).filter(l=>l.type==="reward").reduce((a,l)=>a+(+l.stars||0),0);}
function balance(c){return earned(c)-spent(c);}

/* ===================== 同步（数据库唯一真源：拉取即整体替换，无合并/补传/墓碑/纪元） ===================== */
function setStatus(t){
  const dot=$("syncDot"), txt=$("syncTxt");
  if(t==="synced"){dot.style.background="#fff";txt.textContent="已同步 · 以云端为准";}
  else if(t==="offline"){dot.style.background="#ff3b30";txt.textContent="无法连接云端（操作会被拒绝）";}
  else {dot.style.background="#ffd23f";txt.textContent=t;}
}
let lastSig="";
async function refresh(prefetched){
  if(syncing) return; syncing=true;
  try{
    const all=prefetched||await apiGetAll();
    const map={}; all.forEach(r=>map[r.id]=r.data);
    const logs={};
    all.forEach(r=>{ if(String(r.id).indexOf("bby_log_")===0){
      const d=r.data;
      if(d&&d.id){ let s2=r.id.slice("bby_log_".length); let cid=s2.substring(0,s2.lastIndexOf("_")); if(!cid)cid="wang_xuewei"; (logs[cid]=logs[cid]||[]).push(d); } } });
    const next={
      children:(map["bby_children"]&&map["bby_children"].children)||[{id:"wang_xuewei",name:"王学为"},{id:"wang_xueyi",name:"王学宜"}],
      pwd:/^\d{4}$/.test(String((map["bby_pwd"]||{}).pwd||""))?String((map["bby_pwd"]||{}).pwd):"1234",
      taskcats:(map["bby_tc"]&&Array.isArray(map["bby_tc"].cats))?map["bby_tc"].cats:TASK_DEF.slice(),
      rewardcats:(map["bby_rc"]&&Array.isArray(map["bby_rc"].cats))?map["bby_rc"].cats:REWARD_DEF.slice(),
      presetTasks:(map["bby_preset_tasks"]&&Array.isArray(map["bby_preset_tasks"].items))?map["bby_preset_tasks"].items:[],
      presetRewards:(map["bby_preset_rewards"]&&Array.isArray(map["bby_preset_rewards"].items))?map["bby_preset_rewards"].items:[],
      logs
    };
    const sig=JSON.stringify([next.children,next.pwd,next.taskcats,next.rewardcats,next.presetTasks,next.presetRewards,next.logs]);
    state.children=next.children; state.pwd=next.pwd; state.taskcats=next.taskcats; state.rewardcats=next.rewardcats;
    state.presetTasks=next.presetTasks; state.presetRewards=next.presetRewards; state.logs=next.logs;
    if(!state.cur||!state.children.some(c=>c.id===state.cur)) state.cur=state.children[0]?state.children[0].id:null;
    setStatus("synced");
    if(sig!==lastSig){ lastSig=sig; render(); } // 内容没变不重绘，避免打断正在输入的表单
  }catch(e){ setStatus("offline"); }
  syncing=false;
}

    {id:"bby_preset_rewards",data:{items:sortPresets(PRESET_REWARD_DEF.map(p=>({id:uid(),name:p.name,stars:p.stars,category:p.category}))),ts:now}}

/* 老用户升级：云端缺预设行时补默认预设（任务/兑换各自独立检查） */
async function ensurePresets(hasT,hasR){
  const now=Date.now(); const rows=[];
  if(!hasT) rows.push({id:"bby_preset_tasks",data:{items:sortPresets(PRESET_TASK_DEF.map(p=>({id:uid(),name:p.name,stars:p.stars,category:p.category}))),ts:now}});
  if(!hasR) rows.push({id:"bby_preset_rewards",data:{items:sortPresets(PRESET_REWARD_DEF.map(p=>({id:uid(),name:p.name,stars:p.stars,category:p.category}))),ts:now}});
  if(rows.length) await apiUpsert(rows);
}
async function bootstrap(){
  $("app").innerHTML='<div class="card" style="text-align:center;padding:40px;color:var(--sub)">正在连接云端…</div>';
  try{
    const all=await apiGetAll();
    if(!all.some(r=>r.id==="bby_children")) await seedCloud();
    else {
      const hasT=all.some(r=>r.id==="bby_preset_tasks"), hasR=all.some(r=>r.id==="bby_preset_rewards");
      if(!hasT||!hasR){ try{ await ensurePresets(hasT,hasR); }catch(e){} }
    }
    await refresh(all); setStatus("synced");
  }catch(e){
    $("app").innerHTML='<div class="card" style="text-align:center;padding:44px 20px">'
      +'<p style="font-size:18px;font-weight:800;margin:0 0 8px">无法连接云端</p>'
      +'<p style="font-size:14px;color:var(--sub);margin:0 0 16px">请检查网络后重试</p>'
      +'<button class="bigbtn" onclick="location.reload()">重试</button></div>';
    setStatus("offline"); return;
  }
  setInterval(tick,3000); // 可见时 3 秒轮询（比 8 秒快，隐藏时自动暂停）
  // 打开/切回/聚焦页面时立即拉一次：拿起手机一看就是最新，感知同步≈即时
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
  window.addEventListener("focus",()=>{ refresh(); });
}
async function tick(){ if(document.hidden) return; await refresh(); } // 后台标签页不轮询（浏览器也会强制降频），省云端配额

/* —— 儿童：统计 —— */
function pieChart(segs,emptyTxt){
  const total=segs.reduce((a,s)=>a+s.value,0);
  if(total<=0) return '<div class="pieempty">'+esc(emptyTxt||"暂无数据")+'</div>';
  const sorted=[...segs].sort((a,b)=>b.value-a.value); // 扇区与图例统一按次数（占比）从多到少排列
  const R=56,cx=70,cy=70,sw=26,C=2*Math.PI*R; let off=0,parts="",labels=""; // R=56 保证外缘 70+56+13=139<140，不裁剪、正圆
  sorted.forEach(s=>{ const len=(s.value/total)*C, frac=s.value/total, gap=Math.max(C-len,0.01);
    parts+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'" stroke-dasharray="'+len+' '+gap+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    if(frac>=0.08){ const mid=-90+((off+len/2)/C)*360, rad=mid*Math.PI/180;
      const lx=cx+Math.cos(rad)*R, ly=cy+Math.sin(rad)*R+4;
      labels+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">'+esc(s.label)+' '+Math.round(frac*100)+'%</text>';
    } off+=len;
  });
  const center='<text x="70" y="66" text-anchor="middle" font-size="22" font-weight="900" fill="#2b2b3a">'+total+'</text>'
    +'<text x="70" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#9a9aac">共 '+segs.length+' 类</text>';
  const legend=sorted.map(s=>'<div class="lg"><span class="ld" style="background:'+s.color+'"></span><span>'+esc(s.label)+'</span><span class="lv">'+s.value+' · '+Math.round(s.value/total*100)+'%</span></div>').join("");
  return '<div class="piewrap"><svg class="pie" viewBox="0 0 140 140">'+parts+labels+center+'</svg></div><div class="pielegend">'+legend+'</div>';
}
function viewStat(){

  const tcSegs=Object.entries(tc).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k,value:v,color:PAL[i%PAL.length]}));

  let h='<div class="card"><h3>'+svg("trophy","icon")+esc(c.name)+' 的统计</h3>';

/* 100 次累加验证（真实云端串行读写） */
const VERIFY_LABEL="数据库可靠性验证（100次累加）";
async function runVerify100(){
  if(busy){toast("请稍候，验证进行中");return;}
  busy=true; toast("正在云端跑 100 次累加…");
  const btn=$("btnVerify"); // 运行中禁用并改为"进行中"，结束后恢复并标注结果
  if(btn){ btn.disabled=true; btn.style.opacity=".55"; btn.innerHTML=svg("star","icon")+'请稍后，验证进行中'; }
  let ok=false;
  try{
    await apiUpsert([{id:"bby_verify",data:{val:0,ts:Date.now()}}]);
    for(let i=1;i<=100;i++){
      const cur=await apiGetRow("bby_verify");
      const v=(cur&&typeof cur.val==="number")?cur.val:0;
      await apiUpsert([{id:"bby_verify",data:{val:v+1,ts:Date.now()}}]);
    }
    const fin=await apiGetRow("bby_verify");
    if(fin&&fin.val===100){ ok=true; toast("✅ 数据库可靠性验证通过：100次累加结果=100"); }
    else toast("❌ 验证异常，最终="+(fin&&fin.val));
    try{ await apiDelete("bby_verify"); }catch(e){} // 用完删除，不在数据库留残行
  }catch(e){ toast("验证失败："+e.message); }
  finally{
    busy=false; // 无论成功失败都释放，避免卡死后续验证
    const b=$("btnVerify"); // 重新查询，防止运行中页面重绘导致引用失效
    if(b){ b.disabled=false; b.style.opacity=""; b.innerHTML=svg("star","icon")+esc(VERIFY_LABEL+(ok?"-成功":"-失败")); }
  }
}

/* ===================== 密码 / 确认弹窗 ===================== */
function askPwd(title,cb){ pwdCb=cb; $("pwdTitle").textContent=title; $("pwdInput").value=""; show("maskPwd"); setTimeout(()=>$("pwdInput").focus(),50); }
/* 有效密码：state.pwd 非法（空串/被畸形备份污染）时一律回落 1234，绝不放行任意密码 */
function validPwd(){ const p=String(state.pwd||""); return /^\d{4}$/.test(p)?p:"1234"; }
function submitPwd(){ const v=$("pwdInput").value; if(!/^\d{4}$/.test(v)){toast("请输入 4 位数字");return;}
  if(v!==validPwd()){toast("密码不对");return;}
  hide("maskPwd"); const cb=pwdCb; pwdCb=null; cb&&cb(); }
function askConfirm(title,txt,cb){ confirmCb=cb; $("confirmTitle").textContent=title; $("confirmTxt").textContent=txt; show("maskConfirm"); }
function submitConfirm(){ hide("maskConfirm"); const cb=confirmCb; confirmCb=null; cb&&cb(); }

/* ===================== 导入 / 导出 ===================== */
function exportData(){
  const data={ _app:"工作台", children:state.children, pwd:state.pwd,
    taskcats:state.taskcats, rewardcats:state.rewardcats,
    presetTasks:state.presetTasks||[], presetRewards:state.presetRewards||[],
    logs:state.logs, _v:2 };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="工作台备份_"+todayStr()+".json"; a.click(); URL.revokeObjectURL(a.href);
  toast("已导出备份");
}
function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{ let d; try{ d=JSON.parse(fr.result); }catch(e){ toast("文件不是合法 JSON"); return; }
    if(!d||typeof d!=="object"){ toast("文件结构不正确"); return; }
    // 防呆：备份里没有日志时明确警告，避免"导一份空备份把现有数据全清掉"
    const bakLogCount=Object.values(d.logs||{}).reduce((a,v)=>a+(Array.isArray(v)?v.length:0),0);
    const emptyWarn=bakLogCount===0?"\n\n⚠️ 注意：这份备份里没有任何日志记录，导入会把现有日志全部清空（只保留分类/密码/娃配置）。确定要继续吗？":"";
    askConfirm("导入备份","导入将完全覆盖：两个娃的分类、日志、密码都会替换成备份里的内容（当前新增的数据会被清掉）。"+emptyWarn,async()=>{
      toast("正在覆盖导入，请稍候…");
      // 先解析备份（不碰任何现有数据）
      const children=Array.isArray(d.children)&&d.children.length?d.children.map(c=>({id:String(c.id||uid()),name:String(c.name||"王学为")})):[{id:"wang_xuewei",name:"王学为"},{id:"wang_xueyi",name:"王学宜"}];
      const pwd=(typeof d.pwd==="string"&&/^\d{4}$/.test(d.pwd))?d.pwd:"1234";
      const tc=d.taskcats||[], rc=d.rewardcats||[], lg=d.logs||{};
      let importTC=Array.isArray(tc)?tc:Object.values(tc).flat();
      let importRC=Array.isArray(rc)?rc:Object.values(rc).flat();
      importTC=(Array.isArray(importTC)&&importTC.length)?importTC:TASK_DEF.slice();
      importRC=(Array.isArray(importRC)&&importRC.length)?importRC:REWARD_DEF.slice();
      const taskcats=Array.from(new Set(importTC));
      const rewardcats=Array.from(new Set(importRC));
      // 预设任务/兑换：备份里有则导入（清洗字段），没有则用默认
      const normPresets=(arr,def)=>(Array.isArray(arr)&&arr.length)
        ?arr.map(p=>({id:String(p.id||uid()),name:String(p.name||""),stars:+p.stars||1,category:String(p.category||"其他")})).filter(p=>p.name)
        :def.map(p=>({id:uid(),name:p.name,stars:p.stars,category:p.category}));
      const presetTasks=normPresets(d.presetTasks,PRESET_TASK_DEF);
      const presetRewards=normPresets(d.presetRewards,PRESET_REWARD_DEF);
      const logs={};
      children.forEach(c=>{
        const arr=Array.isArray(lg[c.id])?lg[c.id]:[];
        logs[c.id]=arr.map(e=>({id:String(e.id||uid()),type:e.type==="reward"?"reward":"task",time:String(e.time||beijingNow()),stars:+e.stars||1,category:String(e.category||"其他"),remark:String(e.remark||"")}));
      });
      try{
        const all=await apiGetAll();
        // 删掉云端现有日志行，再写入备份内容（数据库唯一真源：无本地缓存可冲突，无需墓碑/纪元）
        for(const r of all.filter(x=>String(x.id).indexOf("bby_log_")===0)) await delRow(r.id);
        await apiUpsert([
          {id:"bby_meta",data:{v:1}},
          {id:"bby_children",data:{children,ts:Date.now()}},
          {id:"bby_pwd",data:{pwd,ts:Date.now()}},
          {id:"bby_tc",data:{cats:taskcats,ts:Date.now()}},
          {id:"bby_rc",data:{cats:rewardcats,ts:Date.now()}},
          {id:"bby_preset_tasks",data:{items:sortPresets(presetTasks),ts:Date.now()}},
          {id:"bby_preset_rewards",data:{items:sortPresets(presetRewards),ts:Date.now()}}
        ]);
        for(const c of children){ for(const e of (logs[c.id]||[])) await pushRow("bby_log_"+c.id+"_"+e.id,e); }
      }catch(e){ toast("导入失败："+e.message+"（云端可能已部分覆盖，可重试）"); return; }
      // 本地整体替换为备份内容并渲染
      state.children=children; state.pwd=pwd; state.taskcats=taskcats; state.rewardcats=rewardcats;
      state.presetTasks=sortPresets(presetTasks); state.presetRewards=sortPresets(presetRewards); state.logs=logs;
      state.cur=children[0]?children[0].id:null;
      render(); toast("导入成功：已完全覆盖，所有设备随同步更新");
    });
  };
  fr.readAsText(file);
}
function exportXls(){
  const c=curChild();
  const items=(state.logs[c.id]||[]).slice().sort((a,b)=>a.time<b.time?1:-1);
  const escX=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  let rows='<Row><Cell><Data ss:Type="String">类型</Data></Cell><Cell><Data ss:Type="String">名称</Data></Cell><Cell><Data ss:Type="String">时间</Data></Cell><Cell><Data ss:Type="String">星</Data></Cell><Cell><Data ss:Type="String">分类</Data></Cell><Cell><Data ss:Type="String">备注</Data></Cell></Row>';
  items.forEach(l=>{
    const type=l.type==="task"?"任务":"兑换";
    const star=l.type==="task"?("+".concat(l.stars)):("-".concat(l.stars));
    rows+='<Row><Cell><Data ss:Type="String">'+escX(type)+'</Data></Cell><Cell><Data ss:Type="String">'+escX(l.name||l.remark||"")+'</Data></Cell><Cell><Data ss:Type="String">'+escX(l.time)+'</Data></Cell><Cell><Data ss:Type="String">'+escX(star)+'</Data></Cell><Cell><Data ss:Type="String">'+escX(l.category)+'</Data></Cell><Cell><Data ss:Type="String">'+escX(l.remark)+'</Data></Cell></Row>';
  });
  const xml='<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel"><Worksheet ss:Name="'+escX(c.name)+'"><Table>'+rows+'</Table></Worksheet></Workbook>';
  const blob=new Blob(["﻿"+xml],{type:"application/vnd.ms-excel"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="日志_"+c.name+"_"+todayStr()+".xls"; a.click(); URL.revokeObjectURL(a.href);
  toast("已导出Excel");
}

/* ===================== 事件绑定 + 启动 ===================== */
$("tabKid").onclick=()=>switchMode("kid");
$("tabPar").onclick=()=>switchMode("parent");
$("btnExport").onclick=exportData;
$("btnImport").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=""; };
$("pwdOk").onclick=submitPwd; $("pwdCancel").onclick=()=>{hide("maskPwd");pwdCb=null;};
$("pwdInput").onkeydown=e=>{if(e.key==="Enter")submitPwd();};
$("setOk").onclick=submitSet; $("setCancel").onclick=()=>hide("maskSet");
$("setInput").onkeydown=e=>{if(e.key==="Enter")submitSet();};
$("preOk").onclick=savePresetEdit; $("preCancel").onclick=()=>hide("maskPre");
$("preStars").onkeydown=e=>{if(e.key==="Enter")savePresetEdit();};
$("confirmOk").onclick=submitConfirm; $("confirmCancel").onclick=()=>hide("maskConfirm");
// 点遮罩空白处关闭时，同时清掉待执行回调，避免残留的回调被后续操作误触发
document.querySelectorAll(".mask").forEach(m=>m.onclick=e=>{
  if(e.target===m){ m.classList.remove("show"); if(m.id==="maskPwd")pwdCb=null; if(m.id==="maskConfirm")confirmCb=null; }
});

$("brandIcon").innerHTML=svg("star","icon");
bootstrap(); // 方案B：连接云端 → 拉取 → 渲染；断网则显示重试页
</script>
